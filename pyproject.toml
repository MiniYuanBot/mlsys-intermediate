[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
force-exclude = true
extend-exclude = [
    "build",
    "build-*",
    "cmake-build-*",
    "CMakeFiles",
    "out",
    "dist",
    "target",
    "_deps",
    "external",
    "third_party",
    "third-party",
    "vendor",
    "node_modules",
    ".venv*",
    "venv",
    "env",
    ".tox",
    ".nox",
    "__pycache__",
    ".cache",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "results",
    "artifacts",
    "generated",
    "*.generated.*",
    "*.min.*",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
