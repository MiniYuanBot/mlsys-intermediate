<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title description">
<title id="title">Observation stops at the first rejection</title>
<desc id="description">Observation stops at the first rejection. k=4 proposed tokens; accepted prefix length A=1</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#182c42}.mono{font-family:Consolas,"Courier New",monospace}</style>
<rect width="900" height="425" fill="#f8fafc"/>
<text x="32" y="41" font-size="27" text-anchor="start" font-weight="650" style="fill:#182c42">Observation stops at the first rejection</text>
<text x="32" y="72" font-size="17" text-anchor="start" font-weight="400" style="fill:#526579">k=4 proposed tokens; accepted prefix length A=1</text>
<text x="132" y="124" font-size="21" text-anchor="middle" font-weight="600" style="fill:#182c42">Position 1</text>
<rect x="32" y="145" width="194" height="164" rx="10" fill="#dff3ed" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,145,194,164" data-padding="7">
<text x="129.0" y="207.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">ACCEPTED</text>
<text x="129.0" y="233.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">reached: yes</text>
<text x="129.0" y="259.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">success +1</text>
</g>
<text x="346" y="124" font-size="21" text-anchor="middle" font-weight="600" style="fill:#182c42">Position 2</text>
<rect x="246" y="145" width="194" height="164" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="246,145,194,164" data-padding="7">
<text x="343.0" y="207.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">REJECTED</text>
<text x="343.0" y="233.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">reached: yes</text>
<text x="343.0" y="259.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">failure +1</text>
</g>
<text x="560" y="124" font-size="21" text-anchor="middle" font-weight="600" style="fill:#182c42">Position 3</text>
<rect x="460" y="145" width="194" height="164" rx="10" fill="#edf1f5" stroke="#9caebf" stroke-width="1.5" stroke-dasharray="6 4"/>
<g data-label-box="460,145,194,164" data-padding="7">
<text x="557.0" y="207.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">UNOBSERVED</text>
<text x="557.0" y="233.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">reached: no</text>
<text x="557.0" y="259.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">no new evidence</text>
</g>
<text x="774" y="124" font-size="21" text-anchor="middle" font-weight="600" style="fill:#182c42">Position 4</text>
<rect x="674" y="145" width="194" height="164" rx="10" fill="#edf1f5" stroke="#9caebf" stroke-width="1.5" stroke-dasharray="6 4"/>
<g data-label-box="674,145,194,164" data-padding="7">
<text x="771.0" y="207.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">UNOBSERVED</text>
<text x="771.0" y="233.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">reached: no</text>
<text x="771.0" y="259.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">no new evidence</text>
</g>
<polyline points="460,329 460,337 868,337 868,329" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="664.0" y="362" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Censored suffix: do not count as rejection</text>
<text x="32" y="400" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">Proposed k=4; accepted prefix A=1. Discount all old counts before adding evidence.</text>
</svg>
