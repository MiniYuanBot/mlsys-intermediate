<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
<title id="title">User-visible latency and burst delivery</title>
<desc id="description">User-visible latency and burst delivery. Request timeline; schematic and not to scale</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#182c42}.mono{font-family:Consolas,"Courier New",monospace}</style>
<rect width="900" height="560" fill="#f8fafc"/>
<text x="32" y="41" font-size="27" text-anchor="start" font-weight="650" style="fill:#182c42">User-visible latency and burst delivery</text>
<text x="32" y="72" font-size="17" text-anchor="start" font-weight="400" style="fill:#526579">Request timeline; schematic and not to scale</text>
<rect x="60" y="121" width="120" height="59" rx="10" fill="#edf1f5" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="60,121,120,59" data-padding="7">
<text x="120.0" y="156.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">Queue</text>
</g>
<rect x="180" y="121" width="170" height="59" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="180,121,170,59" data-padding="7">
<text x="265.0" y="156.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">Prefill</text>
</g>
<rect x="350" y="121" width="220" height="59" rx="10" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="350,121,220,59" data-padding="7">
<text x="460.0" y="156.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">Round 1</text>
</g>
<rect x="570" y="121" width="240" height="59" rx="10" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="570,121,240,59" data-padding="7">
<text x="690.0" y="156.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">Round 2</text>
</g>
<polyline points="60,243 860,243" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="60,232 60,255" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="60" y="214" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Arrival</text>
<polyline points="350,232 350,255" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="350" y="214" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">First token</text>
<polyline points="570,232 570,255" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="570" y="214" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Burst</text>
<polyline points="810,232 810,255" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="810" y="214" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Last burst</text>
<rect x="565" y="261" width="10" height="9" rx="2" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<rect x="565" y="275" width="10" height="9" rx="2" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<rect x="565" y="289" width="10" height="9" rx="2" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<rect x="805" y="261" width="10" height="9" rx="2" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<rect x="805" y="275" width="10" height="9" rx="2" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<rect x="805" y="289" width="10" height="9" rx="2" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<polyline points="60,329 60,337 350,337 350,329" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="205.0" y="362" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">TTFT</text>
<text x="205" y="393" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Arrival to first visible token</text>
<polyline points="350,403 350,411 810,411 810,403" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
<text x="580.0" y="436" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">After-first-token time</text>
<text x="580" y="469" font-size="20" text-anchor="middle" font-weight="400" style="fill:#182c42">TPOT = (last - first) / (n - 1)</text>
<text x="32" y="510" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">Burst tokens share a timestamp; mean TPOT does not describe each token&#x27;s ITL.</text>
<text x="32" y="535" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">Schematic, not to scale. The formula requires n &gt; 1; single-token requests are separate.</text>
</svg>
