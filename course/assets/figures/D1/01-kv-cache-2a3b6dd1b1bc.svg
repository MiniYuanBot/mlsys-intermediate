<svg xmlns="http://www.w3.org/2000/svg" width="900" height="745" viewBox="0 0 900 745" role="img" aria-labelledby="title description">
<title id="title">GQA groups and split-K are different axes</title>
<desc id="description">GQA groups and split-K are different axes. 16 query heads; 8 KV heads; 128 channels per query head</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#182c42}.mono{font-family:Consolas,"Courier New",monospace}</style>
<rect width="900" height="745" fill="#f8fafc"/>
<text x="32" y="41" font-size="27" text-anchor="start" font-weight="650" style="fill:#182c42">GQA groups and split-K are different axes</text>
<text x="32" y="72" font-size="17" text-anchor="start" font-weight="400" style="fill:#526579">16 query heads; 8 KV heads; 128 channels per query head</text>
<text x="32" y="119" font-size="21" text-anchor="start" font-weight="600" style="fill:#182c42">A. Head mapping: each query belongs to exactly one KV group</text>
<rect x="32" y="143" width="240" height="77" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,143,240,77" data-padding="7">
<text x="152.0" y="174.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">KV head 0</text>
<text x="152.0" y="200.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">query heads 0, 1</text>
</g>
<rect x="330" y="143" width="240" height="77" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="330,143,240,77" data-padding="7">
<text x="450.0" y="174.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">KV head h</text>
<text x="450.0" y="200.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">query heads 2h, 2h+1</text>
</g>
<rect x="628" y="143" width="240" height="77" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="628,143,240,77" data-padding="7">
<text x="748.0" y="174.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">KV head 7</text>
<text x="748.0" y="200.96" font-size="19" text-anchor="middle" font-weight="400" style="fill:#182c42">query heads 14, 15</text>
</g>
<text x="32" y="280" font-size="21" text-anchor="start" font-weight="600" style="fill:#182c42">B. Within one fixed group h: split the token sequence</text>
<rect x="32" y="307" width="240" height="100" rx="10" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,307,240,100" data-padding="7">
<text x="152.0" y="336.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">One warp: (h, split 0)</text>
<text x="152.0" y="362.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">Read KV head h</text>
<text x="152.0" y="388.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">Separate state per query</text>
</g>
<polyline points="152,407 152,439 450,439" fill="none" stroke="#526579" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="330" y="307" width="240" height="100" rx="10" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="330,307,240,100" data-padding="7">
<text x="450.0" y="336.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">One warp: (h, split 1)</text>
<text x="450.0" y="362.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">Read KV head h</text>
<text x="450.0" y="388.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">Separate state per query</text>
</g>
<polyline points="450,407 450,439 450,439" fill="none" stroke="#526579" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="628" y="307" width="240" height="100" rx="10" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="628,307,240,100" data-padding="7">
<text x="748.0" y="336.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">One warp: (h, split S-1)</text>
<text x="748.0" y="362.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">Read KV head h</text>
<text x="748.0" y="388.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">Separate state per query</text>
</g>
<polyline points="748,407 748,439 450,439" fill="none" stroke="#526579" stroke-width="1.5" stroke-linejoin="round"/>
<polyline points="450,439 450,471" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="365" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">...</text>
<rect x="175" y="474" width="550" height="90" rx="10" fill="#dff3ed" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="175,474,550,90" data-padding="7">
<text x="450.0" y="499.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Merge splits separately for query 2h and query 2h+1</text>
<text x="450.0" y="525.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">For each split: multiply l and a by exp(m - M)</text>
<text x="450.0" y="551.12" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">Do not merge across query heads</text>
</g>
<polyline points="450,564 450,605" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="175" y="608" width="550" height="55" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="175,608,550,55" data-padding="7">
<text x="450.0" y="642.98" font-size="22" text-anchor="middle" font-weight="400" style="fill:#182c42">Repeat h=0..7: output [16, 128]</text>
</g>
<text x="32" y="695" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">Schematic: selected splits shown. Every split keeps two independent softmax states.</text>
<text x="32" y="720" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">The complete log-sum-exp merge formula remains in the lecture.</text>
</svg>
