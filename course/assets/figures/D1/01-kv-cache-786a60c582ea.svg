<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title description">
<title id="title">Quantization groups change the error scale</title>
<desc id="description">Quantization groups change the error scale. Same 3 x 3 data; 4-bit affine quantization with group size 3</desc>
