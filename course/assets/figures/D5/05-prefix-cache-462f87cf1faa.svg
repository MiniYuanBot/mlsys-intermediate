<polyline points="485,150 485,310" fill="none" stroke="#526579" stroke-width="3" stroke-linejoin="round"/>
<text x="497" y="319" font-size="19" text-anchor="start" font-weight="400" style="fill:#182c42">publish [1,2] at t=3</text>
<text x="32" y="524" font-size="19" text-anchor="start" font-weight="400" style="fill:#182c42">r2 arrives at t=4: matched=2; reuse=1 (SGLang) or 0 (vLLM).</text>
<text x="32" y="560" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">Two slots; B=2. Prefill costs 1 ms/token; decode costs 1 ms (modeled, not measured).</text>
<text x="32" y="585" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">The two r2 rows are alternative policies, not simultaneous extra requests.</text>
