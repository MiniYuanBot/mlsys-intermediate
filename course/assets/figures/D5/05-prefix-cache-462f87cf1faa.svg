</g>
<text x="32" y="461" font-size="19" text-anchor="start" font-weight="400" style="fill:#182c42">r2: vLLM</text>
<rect x="565" y="435" width="160" height="42" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="565,435,160,42" data-padding="7">
<text x="645.0" y="461.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">prefill</text>
</g>
<rect x="725" y="435" width="80" height="42" rx="10" fill="#eee7fa" stroke="#9caebf" stroke-width="1.5"/>
