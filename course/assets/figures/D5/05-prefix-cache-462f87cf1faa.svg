<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title description">
<title id="title">In-flight misses and publication time</title>
<desc id="description">In-flight misses and publication time. Modeled timeline in ms; one replica with two slots</desc>
