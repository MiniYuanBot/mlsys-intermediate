<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title description">
<title id="title">MoE dispatch preserves every route</title>
<desc id="description">MoE dispatch preserves every route. Stable token-major to expert-major permutation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526579"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#182c42}.mono{font-family:Consolas,"Courier New",monospace}</style>
<rect width="900" height="650" fill="#f8fafc"/>
<text x="32" y="41" font-size="27" text-anchor="start" font-weight="650" style="fill:#182c42">MoE dispatch preserves every route</text>
<text x="32" y="72" font-size="17" text-anchor="start" font-weight="400" style="fill:#526579">Stable token-major to expert-major permutation</text>
<text x="32" y="118" font-size="21" text-anchor="start" font-weight="600" style="fill:#182c42">Input: token-major route records</text>
<text x="495" y="118" font-size="21" text-anchor="start" font-weight="600" style="fill:#182c42">Output: stable expert-major order</text>
<rect x="32" y="140" width="350" height="48" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,140,350,48" data-padding="7">
<text x="207.0" y="169.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r0: token0 / expert2 / w=0.75</text>
</g>
<rect x="32" y="202" width="350" height="48" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,202,350,48" data-padding="7">
<text x="207.0" y="231.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r1: token0 / expert0 / w=0.25</text>
</g>
<rect x="32" y="264" width="350" height="48" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,264,350,48" data-padding="7">
<text x="207.0" y="293.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r2: token1 / expert2 / w=0.5</text>
</g>
<rect x="32" y="326" width="350" height="48" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,326,350,48" data-padding="7">
<text x="207.0" y="355.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r3: token1 / expert2 / w=0.5</text>
</g>
<rect x="32" y="388" width="350" height="48" rx="10" fill="#dff3ed" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,388,350,48" data-padding="7">
<text x="207.0" y="417.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r4: token2 / expert1 / w=1.0</text>
</g>
<rect x="495" y="140" width="373" height="48" rx="10" fill="#e2effc" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="495,140,373,48" data-padding="7">
<text x="681.5" y="169.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r1: expert0 / token0 / w=0.25</text>
</g>
<rect x="495" y="202" width="373" height="48" rx="10" fill="#dff3ed" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="495,202,373,48" data-padding="7">
<text x="681.5" y="231.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r4: expert1 / token2 / w=1.0</text>
</g>
<rect x="495" y="264" width="373" height="48" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="495,264,373,48" data-padding="7">
<text x="681.5" y="293.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r0: expert2 / token0 / w=0.75</text>
</g>
<rect x="495" y="326" width="373" height="48" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="495,326,373,48" data-padding="7">
<text x="681.5" y="355.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r2: expert2 / token1 / w=0.5</text>
</g>
<rect x="495" y="388" width="373" height="48" rx="10" fill="#fff0d6" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="495,388,373,48" data-padding="7">
<text x="681.5" y="417.78" font-size="17" text-anchor="middle" font-weight="400" style="fill:#182c42">r3: expert2 / token1 / w=0.5</text>
</g>
<polyline points="389,288 486,288" fill="none" stroke="#526579" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="437" y="260" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">stable</text>
<text x="437" y="325" font-size="18" text-anchor="middle" font-weight="400" style="fill:#182c42">dispatch</text>
<rect x="32" y="485" width="397" height="75" rx="10" fill="#edf1f5" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="32,485,397,75" data-padding="7">
<text x="230.5" y="516.3" font-size="20" text-anchor="middle" font-weight="400" style="fill:#182c42">counts = [1, 1, 3, 0]</text>
<text x="230.5" y="542.3" font-size="20" text-anchor="middle" font-weight="400" style="fill:#182c42">expert3 has no routes</text>
</g>
<rect x="451" y="485" width="417" height="75" rx="10" fill="#edf1f5" stroke="#9caebf" stroke-width="1.5"/>
<g data-label-box="451,485,417,75" data-padding="7">
<text x="659.5" y="516.3" font-size="20" text-anchor="middle" font-weight="400" style="fill:#182c42">offsets = [0, 1, 2, 5, 5]</text>
<text x="659.5" y="542.3" font-size="20" text-anchor="middle" font-weight="400" style="fill:#182c42">expert3 interval = [5,5)</text>
</g>
<text x="32" y="600" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">r2 and r3 are distinct routes with the same token/expert; keep both weights and outputs.</text>
<text x="32" y="625" font-size="17" text-anchor="start" font-weight="400" style="fill:#182c42">Each route is conserved exactly once. Combine is weighted accumulation, not overwrite.</text>
</svg>
